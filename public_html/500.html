<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceva nu a mers — revenim imediat</title>
<!-- Pagina de eroare 500. Statica si autonoma, fara PHP si fara CSS extern:
     tocmai cand serverul are o problema, ea trebuie sa se afiseze oricum. -->
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 2rem;
    /* Culori scrise literal (nu prin token): pagina de 500 trebuie sa se
       afiseze si cand serverul are o problema, deci nu depinde de site.css.
       Valorile sunt cele din paleta curenta (DESIGN.md), tinute sincron manual. */
    background: #F7EEE4; color: #2E2B26;
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.7;
  }
  main { max-width: 32rem; }
  /* Serif generic de sistem: pagina nu poate incarca fontul woff2 propriu
     (serverul e in eroare), deci foloseste ce are browserul. */
  h1 { font-family: serif; font-size: 2rem; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; font-size: 1.0625rem; }
  a { color: #3F5247; }
  .ram { width: 1px; height: 3rem; background: #C9A48C; margin-bottom: 1.5rem; }
</style>
</head>
<body>
  <main>
    <div class="ram"></div>
    <h1>Ceva nu a mers</h1>
    <p>A apărut o eroare de partea noastră, nu de partea ta. Încearcă să
      reîncarci pagina peste câteva minute.</p>
    <p>Dacă e ceva urgent, mă găsești direct la adresa de email sau pe WhatsApp.
      <br><a href="/">Înapoi la pagina principală</a></p>
  </main>
</body>
</html>
