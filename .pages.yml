media:
  input: public/assets/uploads
  output: /assets/uploads

content:
  - name: texte
    label: Texte site
    type: file
    path: public/content.json
    format: json
    fields:
      - name: hero_lede
        label: "Prima pagină — textul de sub titlu"
        type: text
        description: "Paragraful mare de sub „Nu caut vinovatul, caut tiparul.”"
      - name: cine_tail
        label: "Cine suntem — completarea titlului"
        type: string
        description: "Vine după „Suntem Cristina și Amalia,”"
      - name: cine_p1
        label: "Cine suntem — primul paragraf"
        type: text
      - name: cine_p2
        label: "Cine suntem — al doilea paragraf"
        type: text
      - name: pret_individual
        label: "Preț ședință individuală (lei)"
        type: string
      - name: pret_online
        label: "Preț ședință online (lei)"
        type: string
      - name: pret_evaluare
        label: "Preț evaluare psihologică (lei)"
        type: string
      - name: pret_fise
        label: "Preț fișe CES / încadrare grad (lei)"
        type: string

  - name: articole
    label: "Articole (blog)"
    type: collection
    path: src/content/articole
    filename: "{fields.titlu}.md"
    view:
      fields: [titlu, categorie, data]
      sort: [data]
    fields:
      - name: titlu
        label: "Titlu"
        type: string
      - name: rezumat
        label: "Rezumat (apare în listă și în Google)"
        type: text
      - name: categorie
        label: "Categorie"
        type: string
      - name: data
        label: "Data"
        type: date
      - name: body
        label: "Conținut"
        type: rich-text

  - name: pagini
    label: "Pagini legale"
    type: collection
    path: src/content/pagini
    view:
      fields: [titlu]
    fields:
      - name: titlu
        label: "Titlu"
        type: string
      - name: body
        label: "Conținut"
        type: rich-text
